name: Build Nodo Chatwoot Image

on:
  push:
    branches:
      - nodo-customizations
      # NODO: ramas de rebase contra versiones upstream nuevas también buildean.
      # Permite validar la imagen antes de merge a la rama productiva.
      - 'rebase/**'
  workflow_dispatch:
    inputs:
      chatwoot_version:
        description: 'Tag de Chatwoot upstream a usar como base (ej. v4.17.1)'
        required: true
        default: 'v4.17.1'
      image_tag:
        description: 'Tag a publicar en GHCR (ej. v4.17.1-nodo.1)'
        required: true
        default: 'v4.17.1-nodo.1'

      existing_candidate_tag:
        description: 'Promote an already tested tag without rebuilding (leave empty to build)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CW_VERSION="${{ github.event.inputs.chatwoot_version }}"
            IMG_TAG="${{ github.event.inputs.image_tag }}"
            PISA_LATEST="false"
            if [[ "$BRANCH" == "nodo-customizations" ]]; then PISA_LATEST="true"; fi
          elif [[ "$BRANCH" == rebase/* ]]; then
            # NODO: rama de rebase. Extraer versión del nombre de la rama.
            # Ej: rebase/v4.14.0 → CW_VERSION=v4.14.0, IMG_TAG=v4.14.0-rebase.RUN
            CW_VERSION="${BRANCH#rebase/}"
            IMG_TAG="${CW_VERSION}-rebase.${{ github.run_number }}"
            PISA_LATEST="false"  # NO pisar :latest desde ramas de rebase
          else
            # Rama productiva nodo-customizations.
            CW_VERSION="v4.17.1"
            IMG_TAG="v4.17.1-nodo.${{ github.run_number }}"
            PISA_LATEST="true"
          fi
          echo "cw_version=$CW_VERSION" >> "$GITHUB_OUTPUT"
          echo "img_tag=$IMG_TAG" >> "$GITHUB_OUTPUT"
          echo "pisa_latest=$PISA_LATEST" >> "$GITHUB_OUTPUT"
          echo "Imagen final: ghcr.io/${{ github.repository_owner }}/chatwoot:$IMG_TAG"
          echo "Pisa :latest? $PISA_LATEST"

      - name: Build & push image (con :latest)
        if: inputs.existing_candidate_tag == '' && steps.tags.outputs.pisa_latest == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nodo
          build-args: |
            CHATWOOT_VERSION=${{ steps.tags.outputs.cw_version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/chatwoot:${{ steps.tags.outputs.img_tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/chatwoot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push image (solo tag versionado, sin :latest)
        if: inputs.existing_candidate_tag == '' && steps.tags.outputs.pisa_latest == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nodo
          build-args: |
            CHATWOOT_VERSION=${{ steps.tags.outputs.cw_version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/chatwoot:${{ steps.tags.outputs.img_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote tested image
        if: inputs.existing_candidate_tag != ''
        env:
          PUBLISH_LATEST: ${{ steps.tags.outputs.pisa_latest }}
          SOURCE_TAG: ${{ inputs.existing_candidate_tag }}
          TARGET_TAG: ${{ steps.tags.outputs.img_tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/chatwoot
        run: |
          [[ "$SOURCE_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
          [[ "$TARGET_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TARGET_TAG" "$IMAGE:$SOURCE_TAG"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE:$SOURCE_TAG"
          fi
          docker buildx imagetools inspect "$IMAGE:$TARGET_TAG"

      - name: Summary
        run: |
          echo "### 🚀 Nodo Chatwoot Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Base | \`chatwoot/chatwoot:${{ steps.tags.outputs.cw_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom | \`ghcr.io/${{ github.repository_owner }}/chatwoot:${{ steps.tags.outputs.img_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| También etiquetada como | \`ghcr.io/${{ github.repository_owner }}/chatwoot:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para deployar en EasyPanel cambiá el \`image:\` del stack a:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository_owner }}/chatwoot:${{ steps.tags.outputs.img_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
